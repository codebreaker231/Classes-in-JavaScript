<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planet Cards</title>
    <style>
        body {
            font-family:'Times New Roman', Times, serif;
            background: #f0fff1;
            padding: 30px;
            text-align: center;
        }
        h1 {color: #50ff43; }
        p { color: #555555; }
        .cards{
            display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 25px;
        }
        .card {
            background: rgb(255, 255, 255);
            border: 3px solid #50ff43;
            border-radius: 12px;
            padding: 20px;
            width: 200;
        }
        .planet-name {
            font-size: 22px;
            font-weight: bold;
            color: #2f3130;
        }
        .planet-fact { color: #656965; margin-top: 10px; font-size: 14px; }
        button {
            background: #50ff43;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    
</body>
</html>
